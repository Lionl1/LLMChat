<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local LLM Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-title">Chats</div>
        <button id="newChatBtn" class="btn primary">New Chat</button>
        <div id="chatList" class="chat-list"></div>
        <div class="sidebar-actions">
          <button id="clearChatBtn" class="btn ghost">Clear</button>
          <button id="deleteChatBtn" class="btn ghost danger">Delete</button>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="brand">Local LLM Chat</div>
          <div class="topbar-actions">
            <button id="settingsBtn" class="btn ghost">Settings</button>
          </div>
        </div>

        <div id="messages" class="messages"></div>
        <div id="statusMessage" class="status-message" aria-live="polite"></div>

        <div class="composer">
          <div id="attachmentsList" class="attachments-list"></div>
          <div class="composer-inputs">
            <button id="addFilesBtn" class="btn ghost" type="button">Files</button>
            <input id="fileInput" type="file" multiple hidden />
            <textarea id="messageInput" placeholder="Type your message... (Double-click chats in sidebar to rename)"></textarea>
            <button id="sendBtn" class="btn primary" type="button">Send</button>
          </div>
        </div>
      </main>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="confirmTitle" class="modal-title">Confirm Action</h3>
        </div>
        <div id="confirmBody" class="modal-body">Are you sure you want to proceed?</div>
        <div class="modal-footer">
          <button id="confirmCancelBtn" class="btn ghost">Cancel</button>
          <button id="confirmOkBtn" class="btn primary danger">Proceed</button>
        </div>
      </div>
    </div>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <div id="settingsDrawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-title">Settings</div>
        <button id="closeSettingsBtn" class="btn ghost">Close</button>
      </div>

      <div class="drawer-section">
        <label class="field">
          <span>API URL</span>
          <input id="apiUrlInput" type="text" placeholder="http://localhost:8000/v1/chat/completions" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="apiKeyInput" type="password" placeholder="env: API_KEY" />
        </label>
        <label class="field">
          <span>Model</span>
          <input id="modelInput" type="text" placeholder="local-model" />
        </label>
      </div>

      <div class="drawer-section">
        <label class="field">
          <span>Language</span>
          <select id="languageSelect" class="select-field">
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <label class="field">
          <span>System Prompt</span>
          <textarea id="systemPromptInput" rows="3" placeholder="You are a helpful assistant..."></textarea>
        </label>
      </div>

      <div class="drawer-section">
        <label class="field">
          <span>Temperature</span>
          <input id="temperatureInput" type="range" min="0" max="2" step="0.01" />
          <span id="temperatureValue" class="field-value"></span>
        </label>
        <label class="field">
          <span>Max tokens</span>
          <input id="maxTokensInput" type="number" min="1" />
        </label>
        <label class="field">
          <span>Top P</span>
          <input id="topPInput" type="range" min="0" max="1" step="0.01" />
          <span id="topPValue" class="field-value"></span>
        </label>
      </div>

      <div class="drawer-actions">
        <button id="resetSettingsBtn" class="btn ghost">Reset to Defaults</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
